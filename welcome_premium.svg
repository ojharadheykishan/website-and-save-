<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="70%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="metallicGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Deep Black Background -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Glowing Golden Border -->
  <rect x="20" y="20" width="760" height="560" rx="40" fill="none" stroke="url(#goldBorder)" stroke-width="6" filter="url(#glow)"/>
  <rect x="30" y="30" width="740" height="540" rx="30" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Decorative Corner Elements (Royal Rajasthani Inspired) -->
  <path d="M 60 60 Q 100 100 140 60" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.6"/>
  <path d="M 60 540 Q 100 500 140 540" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.6"/>
  <path d="M 740 60 Q 700 100 660 60" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.6"/>
  <path d="M 740 540 Q 700 500 660 540" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.6"/>
  
  <!-- Robot Shadow -->
  <ellipse cx="400" cy="430" rx="120" ry="30" fill="#000000" opacity="0.4"/>
  
  <!-- Character A - Futuristic Robot -->
  <g transform="translate(280, 180)">
    
    <!-- Robot Base/Feet -->
    <path d="M 60 240 L 180 240 L 170 260 L 70 260 Z" fill="#2d2d2d"/>
    <path d="M 65 240 L 175 240 L 172 248 L 68 248 Z" fill="#d4af37" opacity="0.8"/>
    
    <!-- Legs -->
    <rect x="85" y="180" width="25" height="60" rx="8" fill="#2d2d2d"/>
    <rect x="130" y="180" width="25" height="60" rx="8" fill="#2d2d2d"/>
    <rect x="90" y="175" width="15" height="10" fill="#d4af37"/>
    <rect x="135" y="175" width="15" height="10" fill="#d4af37"/>
    
    <!-- Body -->
    <path d="M 80 140 Q 100 120 120 140 L 120 220 Q 100 240 80 220 Z" fill="url(#robotBody)" stroke="#d4af37" stroke-width="2"/>
    <rect x="90" y="150" width="60" height="10" fill="#d4af37" opacity="0.9"/>
    
    <!-- Chest Panel with Telegram Symbol -->
    <rect x="95" y="165" width="50" height="35" rx="5" fill="#1a1a1a" stroke="#d4af37" stroke-width="2"/>
    <path d="M 110 175 L 120 185 L 130 175 L 120 195 L 110 185 Z" fill="none" stroke="#00ffff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="120" cy="182" r="3" fill="#00ffff"/>
    
    <!-- Arms -->
    <rect x="55" y="155" width="20" height="50" rx="6" fill="url(#robotBody)" stroke="#d4af37" stroke-width="1"/>
    <rect x="165" y="155" width="20" height="50" rx="6" fill="url(#robotBody)" stroke="#d4af37" stroke-width="1"/>
    <rect x="50" y="200" width="30" height="10" fill="#d4af37"/>
    <rect x="160" y="200" width="30" height="10" fill="#d4af37"/>
    
    <!-- Neck -->
    <rect x="105" y="125" width="30" height="15" fill="#2d2d2d"/>
    
    <!-- Head -->
    <path d="M 85 110 Q 100 95 115 110 L 115 130 Q 100 145 85 130 Z" fill="url(#robotBody)" stroke="#d4af37" stroke-width="2"/>
    
    <!-- Robot Face Screen -->
    <rect x="95" y="118" width="50" height="25" rx="4" fill="#0a0a0a"/>
    
    <!-- Electric Blue Eyes -->
    <circle cx="108" cy="130" r="8" fill="url(#eyeGlow)" filter="url(#glow)"/>
    <circle cx="112" cy="130" r="3" fill="#ffffff"/>
    <circle cx="132" cy="130" r="8" fill="url(#eyeGlow)" filter="url(#glow)"/>
    <circle cx="136" cy="130" r="3" fill="#ffffff"/>
    
    <!-- Eye Brow/Detail -->
    <rect x="100" y="114" width="12" height="4" fill="#d4af37"/>
    <rect x="128" y="114" width="12" height="4" fill="#d4af37"/>
    
    <!-- Antenna -->
    <line x1="115" y1="105" x2="115" y2="95" stroke="#2d2d2d" stroke-width="4"/>
    <circle cx="115" cy="90" r="6" fill="#00ffff" filter="url(#glow)"/>
    
    <!-- Golden Details on Head -->
    <path d="M 95 110 L 115 100 L 135 110" fill="none" stroke="#d4af37" stroke-width="2"/>
    
  </g>
  
  <!-- Floating Golden Particles -->
  <circle cx="150" cy="200" r="4" fill="#d4af37" opacity="0.8"/>
  <circle cx="650" cy="150" r="3" fill="#d4af37" opacity="0.6"/>
  <circle cx="100" cy="350" r="3" fill="#d4af37" opacity="0.7"/>
  <circle cx="700" cy="400" r="4" fill="#d4af37" opacity="0.5"/>
  <circle cx="400" cy="100" r="3" fill="#d4af37" opacity="0.6"/>
  <circle cx="600" cy="450" r="3" fill="#d4af37" opacity="0.7"/>
  
  <!-- Brand Glow -->
  <radialGradient id="brandGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
  </radialGradient>
  <circle cx="400" cy="300" r="200" fill="url(#brandGlow)"/>
</svg>
